name: Basic CI Workflow

on:
  push:
    branches:
      - main  # Trigger the workflow when code is pushed to main
  pull_request:
    branches:
      - main  # Also run on pull requests to main

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Check out your code to the runner

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specify the Node.js version

      - name: Install dependencies
        run: npm install  # Install dependencies (edit as per your stack)

      - name: Run a build script
        run: npm run build  # Run your build (or use a different command)

      - name: Run tests
        run: npm test  # Run your tests (adjust as needed)
